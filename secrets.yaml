# CRE secret-NAME mapping. No values live here — values are created with
#   cre secrets create --target=staging-settings
# and are only ever read inside the confidential workflow's enclave. For local
# simulation the CLI resolves each env-var name below from the process env / .env.
#
# The simulator requires EVERY name listed here to resolve, so this file grows
# per task: reserve prices (Task 2), commitment salts (Task 4), BlindOracle keys
# and the attestation HMAC key (Tasks 5 and 8).
#
# Design constraint (measured on this org): a workflow may call getSecrets ONCE
# per execution and request at most 9 ids. Keep this list short.
secretsNames:
  RESERVE_PRICE_AGENT_A:
    - RESERVE_PRICE_AGENT_A_STAGING
  RESERVE_PRICE_AGENT_B:
    - RESERVE_PRICE_AGENT_B_STAGING
